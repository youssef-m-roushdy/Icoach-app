version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: icoach-payment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-payment-db.sql:/docker-entrypoint-initdb.d/init-payment-db.sql # Auto-create payments_db
    networks:
      - icoach-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # .NET 8 Payment Service
  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.payment
    container_name: icoach-payment-service
    restart: unless-stopped
    ports:
      - "8001:8001" # HTTP (Webhooks / Health)
      - "5001:5001" # gRPC (Node.js calls this)
    environment:
      ConnectionStrings__Postgres: ${PAYMENT_DB_CONNECTION_STRING}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__PublicKeyPath: ${JWT_PUBLIC_KEY_PATH}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET}
    volumes:
      - ./keys:/app/keys # Share the public key with Node.js
    networks:
      - icoach-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  icoach-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local