<div class="user-list">
  <app-page-header title="Users" [breadcrumbs]="[{label:'Dashboard',link:'/dashboard'},{label:'Users'}]">
  </app-page-header>

  <app-data-table
    [columns]="columns"
    [rows]="users()"
    [total]="total()"
    [loading]="isLoading()"
    (searchChange)="onSearch($event)"
    (pageChange)="onPage($event)"
    (sortChange)="onSort($event)">
    <div toolbar-actions></div>
    <ng-template #rowTpl let-row>
      <div class="actions-cell" row-actions>
        <a mat-icon-button [routerLink]="['/users', row.id]" matTooltip="View"><mat-icon>visibility</mat-icon></a>
        <a mat-icon-button [routerLink]="['/users', row.id, 'edit']" matTooltip="Edit"><mat-icon>edit</mat-icon></a>
        <button mat-icon-button (click)="deleteUser(row)" class="delete-btn" matTooltip="Delete"><mat-icon>delete_outline</mat-icon></button>
      </div>
    </ng-template>
  </app-data-table>
</div>
