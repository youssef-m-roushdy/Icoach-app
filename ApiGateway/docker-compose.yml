version: '3.8'

services:
  # ============================================================================
  # API Gateway (Ocelot)
  # ============================================================================
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icoach-gateway
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - NODEJS_HOST=host.docker.internal
      - FASTAPI_HOST=host.docker.internal
      - REDIS_CONNECTION=host.docker.internal:6380
      - ConnectionStrings__Redis=host.docker.internal:6380,abortConnect=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gateway-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  gateway-network:
    driver: bridge
    name: gateway-network